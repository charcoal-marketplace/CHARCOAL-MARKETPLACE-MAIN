<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendor Dashboard | Charcoal Marketplace</title>
<link rel="stylesheet" href="vendor.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>
<div class="container">
  <h2>🏪 Vendor Dashboard</h2>
  <p>Only approved vendors can access this page.</p>

  <button onclick="logout()" style="background:red;color:white;padding:10px;border:0;border-radius:8px;">Logout</button>
  <hr>

  <form id="productForm">
    <input id="name" type="text" placeholder="Product name" required>
    <input id="price_pi" type="number" step="0.01" min="0.01" placeholder="Price in Pi" required>
    <input id="location" type="text" placeholder="Location" required>
    <input id="stock" type="number" min="0" placeholder="Stock quantity" required>
    <input id="image" type="file" accept="image/jpeg,image/png,image/webp" required>
    <button id="submitBtn" type="submit">Add Product</button>
  </form>

  <hr>
  <h3>📦 My Products</h3>
  <div id="myProducts"></div>
</div>

<nav class="bottom-navigation">
  <button onclick="goHome()"><i class="fa-solid fa-house"></i><span>Home</span></button>
  <button class="active" onclick="goVendor()"><i class="fa-solid fa-store"></i><span>Vendor</span></button>
  <button onclick="goProfile()"><i class="fa-solid fa-user"></i><span>Profile</span></button>
</nav>

<script src="vendor.js"></script>
</body>
</html>
