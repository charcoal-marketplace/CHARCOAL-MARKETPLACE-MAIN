<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Profile | Charcoal Marketplace</title>

  <!-- PROFILE CSS -->
  <link rel="stylesheet" href="profile.css">

  <!-- FONT AWESOME -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <!-- PI SDK -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>

</head>

<body>

  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header class="profile-header">

    <div>
      <h1>Profile</h1>
      <p>Manage your marketplace account</p>
    </div>

    <button
      class="notification-btn"
      onclick="openNotifications()"
      type="button"
    >
      <i class="fa-regular fa-bell"></i>
      <span id="notificationBadge">0</span>
    </button>

  </header>


  <!-- =====================================================
       MAIN PROFILE
  ====================================================== -->

  <main class="profile-container">


    <!-- ===================================================
         LOGGED OUT VIEW
    ==================================================== -->

    <section id="loggedOutView" class="profile-card">

      <div class="avatar guest-avatar">
        <i class="fa-solid fa-user"></i>
      </div>

      <h2>Your Profile</h2>

      <p class="profile-description">
        Sign in with Pi to access your orders, cart,
        saved products and account settings.
      </p>

      <button
        id="piLoginBtn"
        class="pi-login-btn"
        onclick="loginWithPi()"
        type="button"
      >
        <span class="pi-symbol">π</span>
        Continue with Pi
      </button>

      <!-- Login status -->
      <p id="msg"></p>

    </section>


    <!-- ===================================================
         LOGGED IN VIEW
    ==================================================== -->

    <section id="loggedInView" class="hidden">


      <!-- USER CARD -->

      <div class="user-card">

        <div class="avatar">
          <i class="fa-solid fa-user"></i>
        </div>

        <div class="user-info">

          <h2 id="userName">Pi User</h2>

          <p id="userUsername">@username</p>

          <span class="pi-connected">
            <span class="status-dot"></span>
            Pi Account Connected
          </span>

        </div>

        <button
          class="edit-profile-btn"
          onclick="editProfile()"
          type="button"
        >
          <i class="fa-solid fa-pen"></i>
        </button>

      </div>


      <!-- =================================================
           ACCOUNT SUMMARY
      ================================================== -->

      <div class="stats-card">

        <div class="stat" onclick="openOrders()">
          <strong id="orderCount">0</strong>
          <span>Orders</span>
        </div>

        <div class="stat" onclick="openCart()">
          <strong id="cartCount">0</strong>
          <span>Cart</span>
        </div>

        <div class="stat" onclick="openSaved()">
          <strong id="savedCount">0</strong>
          <span>Saved</span>
        </div>

      </div>


      <!-- =================================================
           ACCOUNT
      ================================================== -->

      <div class="menu-section">

        <h3>ACCOUNT</h3>


        <button
          class="menu-item"
          onclick="openPersonalInfo()"
          type="button"
        >

          <div class="menu-icon">
            <i class="fa-solid fa-user"></i>
          </div>

          <div class="menu-text">
            <strong>Personal Information</strong>
            <span>Manage your account information</span>
          </div>

          <i class="fa-solid fa-chevron-right arrow"></i>

        </button>


        <button
          class="menu-item"
          onclick="openOrders()"
          type="button"
        >

          <div class="menu-icon">
            <i class="fa-solid fa-box"></i>
          </div>

          <div class="menu-text">
            <strong>My Orders</strong>
            <span>View your purchases</span>
          </div>

          <i class="fa-solid fa-chevron-right arrow"></i>

        </button>


        <button
          class="menu-item"
          onclick="openCart()"
          type="button"
        >

          <div class="menu-icon">
            <i class="fa-solid fa-cart-shopping"></i>
          </div>

          <div class="menu-text">
            <strong>My Cart</strong>
            <span>View items waiting for checkout</span>
          </div>

          <i class="fa-solid fa-chevron-right arrow"></i>

        </button>


        <button
          class="menu-item"
          onclick="openSaved()"
          type="button"
        >

          <div class="menu-icon">
            <i class="fa-solid fa-heart"></i>
          </div>

          <div class="menu-text">
            <strong>Saved Products</strong>
            <span>Your favorite charcoal products</span>
          </div>

          <i class="fa-solid fa-chevron-right arrow"></i>

        </button>


        <button
          class="menu-item"
          onclick="openNotifications()"
          type="button"
        >

          <div class="menu-icon">
            <i class="fa-solid fa-bell"></i>
          </div>

          <div class="menu-text">
            <strong>Notifications</strong>
            <span>Updates and marketplace alerts</span>
          </div>

          <i class="fa-solid fa-chevron-right arrow"></i>

        </button>

      </div>


      <!-- =================================================
           MARKETPLACE
      ================================================== -->

      <div class="menu-section">

        <h3>MARKETPLACE</h3>


        <button
          class="menu-item"
          id="vendorMenuItem"
          onclick="openVendorAccount()"
          type="button"
        >

          <div class="menu-icon vendor-icon">
            <i class="fa-solid fa-store"></i>
          </div>

          <div class="menu-text">

            <strong id="vendorTitle">
              Become a Vendor
            </strong>

            <span id="vendorDescription">
              Start selling charcoal on the marketplace
            </span>

          </div>

          <i class="fa-solid fa-chevron-right arrow"></i>

        </button>


        <button
          class="menu-item hidden"
          id="earningsMenuItem"
          onclick="openEarnings()"
          type="button"
        >

          <div class="menu-icon earnings-icon">
            <i class="fa-solid fa-coins"></i>
          </div>

          <div class="menu-text">

            <strong>My Earnings</strong>

            <span>
              View your Pi earnings
            </span>

          </div>

          <i class="fa-solid fa-chevron-right arrow"></i>

        </button>

      </div>


      <!-- =================================================
           SETTINGS
      ================================================== -->

      <div class="menu-section">

        <h3>SETTINGS</h3>


        <button
          class="menu-item"
          onclick="openSettings()"
          type="button"
        >

          <div class="menu-icon">
            <i class="fa-solid fa-gear"></i>
          </div>

          <div class="menu-text">

            <strong>Settings</strong>

            <span>
              App preferences
            </span>

          </div>

          <i class="fa-solid fa-chevron-right arrow"></i>

        </button>


        <button
          class="menu-item"
          onclick="openSecurity()"
          type="button"
        >

          <div class="menu-icon">
            <i class="fa-solid fa-shield-halved"></i>
          </div>

          <div class="menu-text">

            <strong>Security</strong>

            <span>
              Protect your account
            </span>

          </div>

          <i class="fa-solid fa-chevron-right arrow"></i>

        </button>


        <button
          class="menu-item"
          onclick="openSupport()"
          type="button"
        >

          <div class="menu-icon">
            <i class="fa-solid fa-circle-question"></i>
          </div>

          <div class="menu-text">

            <strong>Help & Support</strong>

            <span>
              Get assistance
            </span>

          </div>

          <i class="fa-solid fa-chevron-right arrow"></i>

        </button>

      </div>


      <!-- =================================================
           LOGOUT
      ================================================== -->

      <button
        class="logout-btn"
        onclick="logout()"
        type="button"
      >

        <i class="fa-solid fa-right-from-bracket"></i>

        Logout

      </button>

    </section>

  </main>


  <!-- =====================================================
       BOTTOM NAVNAVIGATION
  ====================================================== -->

  <nav class="bottom-navigation">

    <button
      onclick="goHome()"
      type="button"
    >
      <i class="fa-solid fa-house"></i>
      <span>Home</span>
    </button>


    <button
      onclick="goVendor()"
      type="button"
    >
      <i class="fa-solid fa-store"></i>
      <span>Vendor</span>
    </button>


    <button
      onclick="goProfile()"
      type="button"
    >
      <i class="fa-solid fa-user"></i>
      <span>Profile</span>
    </button>

  </nav>


  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <!-- SHARED APP JS -->
  <script src="home.js"></script>

  <!-- PROFILE JS -->
  <script src="profile.js"></script>

</body>

</html>
